name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install --disable-pip-version-check -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm exec --workspace frontend prettier -- --check .
      - run: npm exec prettier -- --check tests/e2e package.json
      - run: npm run test
      - run: npm run build

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate staging overlay
        env:
          MINIO_ROOT_PASSWORD: ci-only-minio-password-2026
        run: docker compose -f docker-compose.yml -f docker/compose.staging.yml config --quiet

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    timeout-minutes: 30
    env:
      DEMO_MODE: "true"
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      RATE_LIMIT_LOGIN_PER_MINUTE: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start application stack
        run: docker compose up --build --detach
      - name: Wait for the frontend
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - run: npm run test:e2e
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
            docker-compose.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
