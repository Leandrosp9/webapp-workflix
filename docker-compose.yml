name: workflix

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflix}
      POSTGRES_USER: ${POSTGRES_USER:-workflix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflix}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - workflix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Workflix API}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEMO_MODE: ${DEMO_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workflix}:${POSTGRES_PASSWORD:-workflix}@postgres:5432/${POSTGRES_DB:-workflix}
      JWT_SECRET: ${JWT_SECRET:-local-only-secret-change-before-deployment}
      JWT_ACCESS_EXPIRES_MINUTES: ${JWT_ACCESS_EXPIRES_MINUTES:-15}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-groq}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-gemini-embedding-2}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-768}
      RAG_MAX_PDF_PAGES: ${RAG_MAX_PDF_PAGES:-500}
      RAG_RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT:-6}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-local}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      UPLOAD_DIRECTORY: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      RATE_LIMIT_PROVIDER: ${RATE_LIMIT_PROVIDER:-memory}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REFRESH_PER_MINUTE: ${RATE_LIMIT_REFRESH_PER_MINUTE:-30}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-10}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SECRETS_MANAGER_PROVIDER: ${SECRETS_MANAGER_PROVIDER:-env}
      AWS_SECRET_ID: ${AWS_SECRET_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRETS_ENDPOINT_URL: ${AWS_SECRETS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped
    read_only: true
    volumes:
      - workflix_uploads:/app/uploads
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  workflix_postgres_data:
  workflix_uploads:
