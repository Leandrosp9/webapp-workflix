name: workflix-staging

services:
  redis:
    image: redis:8.2.1-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workflix-staging}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - workflix_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workflix-staging}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-workflix-staging}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set staging http://minio:9000 "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "staging/$${S3_BUCKET}" &&
        mc anonymous set none "staging/$${S3_BUCKET}"
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FILE_STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET:-workflix-staging}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-workflix-staging}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      RATE_LIMIT_PROVIDER: redis
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY_HEADERS: "true"
      SECRETS_MANAGER_PROVIDER: ${SECRETS_MANAGER_PROVIDER:-aws}
      AWS_SECRET_ID: ${AWS_SECRET_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRETS_ENDPOINT_URL: ${AWS_SECRETS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FILE_STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET:-workflix-staging}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-workflix-staging}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      SECRETS_MANAGER_PROVIDER: ${SECRETS_MANAGER_PROVIDER:-aws}
      AWS_SECRET_ID: ${AWS_SECRET_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRETS_ENDPOINT_URL: ${AWS_SECRETS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  workflix_minio_data:
