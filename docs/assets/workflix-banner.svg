<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Workflix corporate learning and knowledge platform</title>
  <description id="description">A dark indigo Workflix banner showing the web, API, and knowledge platform architecture.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090c14"/>
      <stop offset="0.58" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#14142a"/>
    </linearGradient>
    <linearGradient id="accent" x1="65" y1="65" x2="1135" y2="435" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(935 190) rotate(90) scale(330 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#background)"/>
  <rect width="1200" height="500" rx="28" fill="url(#glow)"/>
  <path d="M0 1h1200" stroke="url(#accent)" stroke-opacity="0.7"/>
  <g transform="translate(72 72)">
    <rect width="52" height="52" rx="15" fill="url(#accent)"/>
    <path d="M12 14l7 25h7l3.5-13 3.5 13h7l7-25h-8l-3 15-3.5-15h-6L23 29l-3-15z" fill="#0b1020"/>
    <text x="68" y="35" fill="#f7f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700" letter-spacing="-0.7">Workflix</text>
  </g>
  <text x="72" y="209" fill="#6ee7f9" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">CORPORATE LEARNING · KNOWLEDGE PLATFORM</text>
  <text x="72" y="268" fill="#f7f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="750" letter-spacing="-2">Knowledge that moves</text>
  <text x="72" y="321" fill="#a3acbd" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="750" letter-spacing="-2">the whole company forward.</text>
  <text x="72" y="370" fill="#7e879a" font-family="Inter,Segoe UI,sans-serif" font-size="16">Training, procedures, progress, and source-aware intelligence in one secure place.</text>
  <g transform="translate(750 100)" filter="url(#shadow)">
    <rect width="378" height="300" rx="22" fill="#111724" fill-opacity="0.88" stroke="#fff" stroke-opacity="0.1"/>
    <text x="24" y="36" fill="#8993a6" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PLATFORM FOUNDATION</text>
    <circle cx="348" cy="32" r="4" fill="#65e4a3"/>
    <path d="M24 57h330" stroke="#fff" stroke-opacity="0.08"/>
    <g transform="translate(27 80)">
      <rect width="324" height="52" rx="11" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.09"/>
      <circle cx="27" cy="26" r="10" fill="#6ee7f9" fill-opacity="0.18" stroke="#6ee7f9" stroke-opacity="0.75"/>
      <text x="49" y="23" fill="#e8ebf1" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650">Web experience</text>
      <text x="49" y="38" fill="#768094" font-family="Inter,Segoe UI,sans-serif" font-size="10">React · TypeScript · Vite</text>
    </g>
    <path d="M189 132v16" stroke="#7c5cff" stroke-opacity="0.65"/>
    <g transform="translate(43 148)">
      <rect width="292" height="52" rx="11" fill="#7c5cff" fill-opacity="0.07" stroke="#7c5cff" stroke-opacity="0.32"/>
      <circle cx="27" cy="26" r="10" fill="#7c5cff" fill-opacity="0.2" stroke="#9d8bff" stroke-opacity="0.8"/>
      <text x="49" y="23" fill="#e8ebf1" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650">Application API</text>
      <text x="49" y="38" fill="#768094" font-family="Inter,Segoe UI,sans-serif" font-size="10">FastAPI · REST · SQLAlchemy</text>
    </g>
    <path d="M189 200v16" stroke="#7c5cff" stroke-opacity="0.65"/>
    <g transform="translate(27 216)">
      <rect width="324" height="52" rx="11" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.09"/>
      <circle cx="27" cy="26" r="10" fill="#6ee7f9" fill-opacity="0.18" stroke="#6ee7f9" stroke-opacity="0.75"/>
      <text x="49" y="23" fill="#e8ebf1" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650">Knowledge core</text>
      <text x="49" y="38" fill="#768094" font-family="Inter,Segoe UI,sans-serif" font-size="10">PostgreSQL · pgvector · Alembic</text>
    </g>
  </g>
</svg>

